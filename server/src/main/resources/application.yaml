server:
  port: ${PORT:8080}

spring:
  application:
    name: kdm-tracker
  datasource:
    url: jdbc:h2:file:./data/kdm-tracker
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

sync:
  jwt:
    secret: ${SYNC_JWT_SECRET:dev-only-insecure-secret-change-me}
    expiry-seconds: ${SYNC_JWT_EXPIRY_SECONDS:86400}
  migration:
    run-on-startup: ${SYNC_MIGRATION_RUN_ON_STARTUP:false}
