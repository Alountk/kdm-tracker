<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit resource')}"></head>
<body>
<header th:replace="~{fragments :: header(${settlementId})}"></header>
<main class="container">
    <h1>Edit resource</h1>
    <form th:action="@{/settlements/{id}/resources/{rid}(id=${settlementId}, rid=${form.id})}" th:object="${form}" method="post" class="form-grid">
        <div class="errors span-full" th:if="${#fields.hasAnyErrors()}">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p>
        </div>
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div>
            <label for="category">Category</label>
            <select id="category" th:field="*{category}">
                <option value="BASIC">BASIC</option>
                <option value="SPECIAL">SPECIAL</option>
                <option value="MONSTER">MONSTER</option>
            </select>
        </div>
        <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" th:field="*{quantity}" min="0">
            <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
        </div>
        <div class="form-actions">
            <button type="submit">Save</button>
            <a class="button secondary" th:href="@{/settlements/{id}/resources(id=${settlementId})}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
