<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New settlement')}"></head>
<body>
<header th:replace="~{fragments :: header(${settlementId})}"></header>
<main class="container">
    <h1>New settlement</h1>
    <form th:action="@{/settlements}" th:object="${form}" method="post" class="form-grid">
        <div class="errors span-full" th:if="${#fields.hasAnyErrors()}">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p>
        </div>
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div>
            <label for="lanternYear">Lantern year</label>
            <input id="lanternYear" type="number" th:field="*{lanternYear}" min="1" required>
            <span class="field-error" th:if="${#fields.hasErrors('lanternYear')}" th:errors="*{lanternYear}"></span>
        </div>
        <div class="span-full">
            <label for="notes">Notes</label>
            <textarea id="notes" th:field="*{notes}"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit">Create settlement</button>
            <a class="button secondary" th:href="@{/}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
