<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Campaign log')}"></head>
<body>
<header th:replace="~{fragments :: header(${settlementId})}"></header>
<main class="container">
    <h1>Campaign log</h1>
    <table>
        <thead>
        <tr>
            <th>Year</th>
            <th>Title</th>
            <th>Body</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${entries}">
            <td th:text="${entry.lanternYear}">1</td>
            <td th:text="${entry.title}">Title</td>
            <td th:text="${entry.body}">Body</td>
            <td th:text="${entry.createdAt}">Timestamp</td>
            <td class="actions">
                <a th:href="@{/settlements/{id}/log/{lid}/edit(id=${settlementId}, lid=${entry.id})}">Edit</a>
                <form th:action="@{/settlements/{id}/log/{lid}/delete(id=${settlementId}, lid=${entry.id})}" method="post" class="inline">
                    <button type="submit" class="danger small">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(entries)}">
            <td colspan="5" class="muted">No log entries yet.</td>
        </tr>
        </tbody>
    </table>

    <h2>Add log entry</h2>
    <form th:action="@{/settlements/{id}/log(id=${settlementId})}" th:object="${form}" method="post" class="form-grid">
        <div class="errors span-full" th:if="${#fields.hasAnyErrors()}">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p>
        </div>
        <div>
            <label for="lanternYear">Lantern year</label>
            <input id="lanternYear" type="number" th:field="*{lanternYear}" min="1" required>
            <span class="field-error" th:if="${#fields.hasErrors('lanternYear')}" th:errors="*{lanternYear}"></span>
        </div>
        <div class="span-two">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" required>
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>
        <div class="span-full">
            <label for="body">Body</label>
            <textarea id="body" th:field="*{body}"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit">Add entry</button>
        </div>
    </form>
</main>
</body>
</html>
