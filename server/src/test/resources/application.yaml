spring:
  application:
    name: kdm-tracker
  datasource:
    url: jdbc:h2:mem:kdmtracker;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

sync:
  jwt:
    secret: test-secret-not-for-production-0123456789
    expiry-seconds: 3600
