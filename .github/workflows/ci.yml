# Formatting and unit tests for every module, on pull requests and on pushes to main.
#
# Kept narrow on purpose: one job, no matrix, no Android lint or instrumented tests, and a newer
# push to the same pull request cancels the run in flight. It runs on every change, documentation
# included, because a required check that is skipped leaves the pull request waiting forever.
#
# Every Gradle invocation needs the Android SDK (`:core` applies the Android Gradle Plugin), so the
# job installs the packages listed in the README before running anything.
#
# Actions are pinned to commit SHAs on purpose (as in ai-review.yml): change SHA and comment together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      # --no-daemon uses Gradle's default JVM limits (about 384 MB of Metaspace), which the Android and
      # Kotlin Multiplatform plugins exceed: the first run died with OutOfMemoryError: Metaspace.
      - name: Format and unit tests
        run: >
          ./gradlew --no-daemon
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
          spotlessCheck :core:jvmTest :data:jvmTest :server:test :app-android:testDebugUnitTest
