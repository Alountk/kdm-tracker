# Builds a signed release APK and publishes it as a GitHub Release when a `v*` tag is pushed.
#
# The tag names the version (`v0.3.0` -> versionName 0.3.0) and the run number becomes the
# versionCode, so each release installs over the previous one. The signing key comes from the
# KDM_KEYSTORE_* repository secrets; see "Releasing" in docs/development.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KDM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KDM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          KDM_KEYSTORE_PASSWORD: ${{ secrets.KDM_KEYSTORE_PASSWORD }}
          KDM_KEY_ALIAS: ${{ secrets.KDM_KEY_ALIAS }}
          KDM_KEY_PASSWORD: ${{ secrets.KDM_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"
          -PappVersionName="${GITHUB_REF_NAME#v}"
          -PappVersionCode="${GITHUB_RUN_NUMBER}"
          :app-android:assembleRelease

      - name: Verify the APK signature
        run: |
          apk=app-android/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="kdm-tracker-${GITHUB_REF_NAME}.apk"
          cp app-android/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
